version: '3.8'

# ==============================================================
# Practical 11: Multi-Container Orchestration with Docker Compose
# Student: Vaidehi Patel (24CS079) | Course: ITUE301
# Architecture: Frontend (React) -> Backend (Express) -> MongoDB
# Network: app-network (Bridge) | Volume: mongo-data (Named Volume)
# ==============================================================

services:
  # 1. MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: task-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=taskdb
    volumes:
      # Supplementary Problem 3: Named volume for persistent database storage
      - mongo-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js Express Backend Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: task-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # Reference MongoDB container by service name 'mongodb' rather than localhost
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=jay_ladva_24cs079_docker_secret_key_2026
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # 3. React Vite Frontend Service
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - app-network

# Dedicated internal bridge network for inter-container DNS and traffic
networks:
  app-network:
    driver: bridge

# Supplementary Problem 3: Named volume ensuring task data survives container restarts
volumes:
  mongo-data:
    driver: local
